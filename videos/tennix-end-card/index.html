        var S0 = 1.5; // uniform flight scale -> 1.0
        var SPIN0 = -540; // seams land in their final orientation
        var DIP_START = 0.8,
          DIP_DUR = 0.12,
          DIP_PX = 5;
        // echo trail (motion-blur-streak path B)
        var ECHO_DELTA = 0.022;
        var ECHO_BASE = [0.35, 0.2, 0.1];
        var ECHO_GONE = 0.75;

        var power2Out = gsap.parseEase("power2.out");
        var power3Out = gsap.parseEase("power3.out");

        function clamp01(v) {
          return v < 0 ? 0 : v > 1 ? 1 : v;
        }
        function flightAt(t) {
          var p = clamp01(t / FLIGHT);
          var u = power2Out(p);
          var a = (1 - u) * (1 - u),
            b = 2 * u * (1 - u),
            c = u * u;
          var x = a * P0.x + b * P1.x + c * P2.x;
          var y = a * P0.y + b * P1.y + c * P2.y;
          var s = S0 + (1 - S0) * u;
          var r = SPIN0 * (1 - power3Out(p));
          if (t >= DIP_START && t <= DIP_START + DIP_DUR) {
            var q = power2Out((t - DIP_START) / DIP_DUR);
            y += DIP_PX * Math.sin(Math.PI * q);
          }
          return { x: x, y: y, s: s, r: r, done: p >= 1 };
        }
        function transformFor(st) {
          if (st.done && Math.abs(st.y - CY) < 1e-6) return "";
          return (
            "translate(" + st.x.toFixed(3) + " " + st.y.toFixed(3) + ") scale(" + st.s.toFixed(5) + ") rotate(" +
            st.r.toFixed(3) + ") translate(" + (-CX) + " " + (-CY) + ")"
          );
        }

        var ball = document.getElementById("ball");
        var ghosts = [
          document.getElementById("ghost1"),
          document.getElementById("ghost2"),
          document.getElementById("ghost3"),
        ];
        var band1 = document.getElementById("band1");
        var band2 = document.getElementById("band2");

        function applyBall(t) {
          var lead = flightAt(t);
          var tf = transformFor(lead);
          if (tf) ball.setAttribute("transform", tf);
          else ball.removeAttribute("transform");
          var fade = clamp01((ECHO_GONE - t) / 0.2);
          for (var i = 0; i < ghosts.length; i++) {
            var g = flightAt(t - (i + 1) * ECHO_DELTA);
            var dist = Math.hypot(g.x - lead.x, g.y - lead.y);
            var a = ECHO_BASE[i] * clamp01(dist / 24) * fade;
            ghosts[i].setAttribute("transform", transformFor(g) || "translate(0 0)");
            ghosts[i].setAttribute("opacity", a < 0.002 ? "0" : a.toFixed(4));
          }
        }
        function bandTransform(angle, s) {
          return "translate(" + XC.x + " " + XC.y + ") rotate(" + angle + ") scale(" + s.toFixed(5) + " 1)";
        }

        var bandA = { v: 0 },
          bandB = { v: 0 };
        function applyBands() {
          band1.setAttribute("transform", bandTransform(54.96, bandA.v));
          band2.setAttribute("transform", bandTransform(126.2, bandB.v));
        }

        var tl = gsap.timeline({
          paused: true,
          onUpdate: function () {
            applyBall(tl.time());
            applyImpact(tl.time());
          },
        });

        // anchor: timeline spans the full 4.5s so every seek fires onUpdate
        tl.to({ p: 0 }, { p: 1, duration: 4.5, ease: "none" }, 0);

        // b1 impact (logo-sting accent ring + cursor-click-ripple mechanics, no white flash)
        // and ambient-glow-bloom. Pure functions of tl.time(): exactly 0 outside their windows.
        var ringLime = document.getElementById("ring-lime");
        var ringViolet = document.getElementById("ring-violet");
        var bloom = document.getElementById("bloom");
        var sineOut = gsap.parseEase("sine.out");
        var sineInOut = gsap.parseEase("sine.inOut");
        function ring(el, t, t0, dur, r0, r1, o0, ease) {
          if (t < t0 || t >= t0 + dur) {
            el.setAttribute("opacity", "0");
            el.setAttribute("r", String(r0));
            return;
          }
          var e = ease((t - t0) / dur);
          el.setAttribute("r", (r0 + (r1 - r0) * e).toFixed(3));
          el.setAttribute("opacity", (o0 * (1 - e)).toFixed(4));
        }
        function applyImpact(t) {
          ring(ringLime, t, 0.8, 0.5, 24, 120, 0.9, power2Out);
          ring(ringViolet, t, 0.87, 0.5, 24, 80, 0.6, power3Out);
          var b = 0;
          if (t >= 0.8 && t < 0.9) b = 0.3 * sineOut((t - 0.8) / 0.1);
          else if (t >= 0.9 && t < 1.6) b = 0.3 * (1 - sineInOut((t - 0.9) / 0.7));
          bloom.setAttribute("opacity", b.toFixed(4));
        }

        // b2 X strokes grow out of the crossing (expo.out), then swap to the original path
        tl.fromTo(bandA, { v: 0 }, { v: 1, duration: 0.28, ease: "expo.out", onUpdate: applyBands }, 0.8);
        tl.fromTo(bandB, { v: 0 }, { v: 1, duration: 0.28, ease: "expo.out", onUpdate: applyBands, immediateRender: false }, 0.86);
        tl.fromTo("#x-final", { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.001 }, 1.15);
        tl.fromTo("#x-grow", { attr: { opacity: 1 } }, { attr: { opacity: 0 }, duration: 0.001 }, 1.15);

        // b3 TENNI ripples right-to-left, I first, T last: bottom-up wipe + rise
        for (var k = 0; k < 5; k++) {
          var idx = 4 - k;
          var at = 1.0 + k * 0.06;
          tl.fromTo("#tmask" + idx, { attr: { y: 790, height: 0 } }, { attr: { y: 690, height: 104 }, duration: 0.38, ease: "power4.out" }, at);
          tl.fromTo("#tl" + idx, { y: 36 }, { y: 0, duration: 0.38, ease: "power4.out" }, at);
        }

        // b4 FOLLOW FOR MORE tracks in: per-letter translateX from 1.6x offset, no glyph scaling
        var TAG_CX = 480;
        gsap.utils.toArray("#tagline .tg").forEach(function (el) {
          var cx = parseFloat(el.getAttribute("data-cx"));
          tl.fromTo(el, { x: (cx - TAG_CX) * 0.6 }, { x: 0, duration: 0.6, ease: "expo.out" }, 1.9);
        });
        tl.fromTo("#tagline", { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.25, ease: "power1.out" }, 1.9);

        // b5 lime bar sweeps left to right
        tl.fromTo("#bar", { attr: { width: 0 } }, { attr: { width: 1080 }, duration: 0.45, ease: "expo.out" }, 2.3);

        // b6 hold: dead still to 4.5s
        tl.seek(0);
        applyBall(0);
        applyImpact(0);
        applyBands();
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>

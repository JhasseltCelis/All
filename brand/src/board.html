<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&display=swap">
<style>
body{margin:0;width:1600px;height:1000px;font-family:"Geist Mono",monospace;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:520px 480px}
.cell{display:grid;place-items:center;position:relative}
.lab{position:absolute;left:28px;top:22px;font-size:15px;letter-spacing:.04em;color:#5E5E66}
.a{background:#fff;grid-column:1/3;border-bottom:1px solid #E4E4E8;align-content:center;gap:60px}
.b{background:#0B0B0C;align-content:center;gap:50px}.b .lab{color:#A0A0AA}
.c{background:#F4F4F6;border-left:1px solid #E4E4E8}
.fav{display:flex;align-items:end;gap:40px}.fav div{display:grid;justify-items:center;gap:12px;font-size:13px;color:#5E5E66}
</style></head><body>
<div class="cell a"><span class="lab">HORIZONTAL AND STACKED</span><img src="../svg/logo-horizontal.svg" height="110"><img src="../svg/logo-stacked.svg" height="110"></div>
<div class="cell b"><span class="lab">ON BLACK</span><img src="../svg/logo-horizontal-white.svg" height="70"><img src="../svg/logo-stacked-white.svg" height="90"></div>
<div class="cell c"><span class="lab">ICONS AND SOCIAL PROFILE</span><div class="fav">
 <div><img src="../png/social-profile.png" width="170" style="border-radius:50%;box-shadow:0 0 0 1px #E4E4E8"><span>profile</span></div>
 <div><img src="../icons/icon-180.png" width="90"><span>app</span></div>
 <div><img src="../icons/icon-32.png" width="32"><span>32 px</span></div>
 <div><img src="../icons/icon-16.png" width="16"><span>16 px</span></div></div></div>
</body></html>

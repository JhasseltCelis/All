<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="4717.2" viewBox="0 0 1200 4717.2"><title>AI For You infographic</title><rect width="1200" height="4717.2" fill="#FFFFFF"/><rect x="95.96" y="44.84" width="33.6" height="33.6" fill="none" stroke="#0B0B0C" stroke-width="1.26"/><rect x="90.92" y="49.88" width="33.6" height="33.6" fill="#FFFFFF" stroke="#0B0B0C" stroke-width="1.26"/><rect x="85.88" y="54.92" width="33.6" height="33.6" fill="#FFFFFF" stroke="#0B0B0C" stroke-width="1.26"/><rect x="80.84" y="59.96" width="33.6" height="33.6" fill="#2340FF"/><path d="M89.24 77.18 L94.7 82.64 L106.46 70.04" fill="none" stroke="#FFFFFF" stroke-width="3.78" stroke-linecap="square"/><text x="142" y="84" font-family="Archivo Expanded" font-weight="900" font-size="30" fill="#0B0B0C" letter-spacing="-0.3">AI FOR YOU</text><text x="1120" y="80" font-family="Geist Mono" font-weight="400" font-size="20" fill="#5E5E66" text-anchor="end">Personal AI setup</text><line x1="80" y1="130" x2="1120" y2="130" stroke="#E4E4E8" stroke-width="1"/><text x="80" y="310.96" font-family="Archivo Expanded" font-weight="900" font-size="168" fill="#0B0B0C" letter-spacing="-5.04">YOUR AI,</text><text x="80" y="455.44" font-family="Archivo Expanded" font-weight="900" font-size="168" fill="#2340FF" letter-spacing="-5.04">SET UP</text><text x="80" y="599.92" font-family="Archivo Expanded" font-weight="900" font-size="168" fill="#2340FF" letter-spacing="-5.04">FOR YOU.</text><text x="80" y="671.44" font-family="Geist" font-weight="400" font-size="32" fill="#5E5E66">You already pay for Claude, ChatGPT or Gemini. In one call I</text><text x="80" y="716.24" font-family="Geist" font-weight="400" font-size="32" fill="#5E5E66">give it your voice, your calendar, your files and your repeat</text><text x="80" y="761.04" font-family="Geist" font-weight="400" font-size="32" fill="#5E5E66">tasks.</text><rect x="80" y="845.44" width="1040" height="92" fill="#FFFFFF" stroke="#0B0B0C" stroke-width="2"/><text x="112" y="901.44" font-family="Geist Mono" font-weight="400" font-size="18" fill="#5E5E66" letter-spacing="0.72">YOU ASK</text><text x="230" y="902.44" font-family="Geist" font-weight="500" font-size="25" fill="#0B0B0C">Reply to Carla. She wants to move Thursday&#x27;s viewing to Saturday.</text><rect x="600" y="937.44" width="520" height="470" fill="#F4F4F6"/><rect x="80" y="937.44" width="1040" height="470" fill="none" stroke="#0B0B0C" stroke-width="2"/><line x1="600" y1="937.44" x2="600" y2="1407.44" stroke="#0B0B0C" stroke-width="2"/><text x="116" y="1007.44" font-family="Archivo Expanded" font-weight="900" font-size="40" fill="#5E5E66" letter-spacing="-0.4">BEFORE</text><line x1="112" y1="1037.44" x2="112" y2="1277.44" stroke="#E4E4E8" stroke-width="4"/><text x="134" y="1073.44" font-family="Geist" font-weight="400" font-size="23" fill="#5E5E66">Dear Carla, Thank you for reaching out.</text><text x="134" y="1107.94" font-family="Geist" font-weight="400" font-size="23" fill="#5E5E66">I hope this message finds you well. I</text><text x="134" y="1142.44" font-family="Geist" font-weight="400" font-size="23" fill="#5E5E66">would be more than happy to</text><text x="134" y="1176.94" font-family="Geist" font-weight="400" font-size="23" fill="#5E5E66">accommodate your request. Please let</text><text x="134" y="1211.44" font-family="Geist" font-weight="400" font-size="23" fill="#5E5E66">me know what time works best for you</text><text x="134" y="1245.94" font-family="Geist" font-weight="400" font-size="23" fill="#5E5E66">on Saturday. Best regards.</text><rect x="116" y="1345.44" width="14" height="14" fill="#5E5E66"/><text x="142" y="1358.44" font-family="Geist Mono" font-weight="400" font-size="19" fill="#5E5E66">You&#x27;d rewrite this</text><text x="636" y="1007.44" font-family="Archivo Expanded" font-weight="900" font-size="40" fill="#2340FF" letter-spacing="-0.4">AFTER</text><line x1="632" y1="1037.44" x2="632" y2="1277.44" stroke="#2340FF" stroke-width="4"/><text x="654" y="1073.44" font-family="Geist" font-weight="400" font-size="23" fill="#0B0B0C">Hi Carla, no problem at all. Saturday I&#x27;m</text><text x="654" y="1107.94" font-family="Geist" font-weight="400" font-size="23" fill="#0B0B0C">free at 10:00 or 14:30 at the Brickell</text><text x="654" y="1142.44" font-family="Geist" font-weight="400" font-size="23" fill="#0B0B0C">apartment. Which works for you? Once</text><text x="654" y="1176.94" font-family="Geist" font-weight="400" font-size="23" fill="#0B0B0C">you confirm, I&#x27;ll send parking details</text><text x="654" y="1211.44" font-family="Geist" font-weight="400" font-size="23" fill="#0B0B0C">and the floor plan.</text><rect x="636" y="1345.44" width="14" height="14" fill="#2340FF"/><text x="662" y="1358.44" font-family="Geist Mono" font-weight="400" font-size="19" fill="#0B0B0C">Ready to send</text><rect x="0" y="1497.44" width="1200" height="1014.88" fill="#0B0B0C"/><text x="80" y="1662.32" font-family="Archivo Expanded" font-weight="900" font-size="104" fill="#FFFFFF" letter-spacing="-3.12">FOUR LAYERS.</text><text x="80" y="1751.76" font-family="Archivo Expanded" font-weight="900" font-size="104" fill="#2340FF" letter-spacing="-3.12">ONE CALL.</text><rect x="80" y="1822.32" width="520" height="300" fill="none" stroke="#333338" stroke-width="1"/><text x="114" y="1906.32" font-family="Archivo Expanded" font-weight="900" font-size="56" fill="#2340FF">01</text><text x="114" y="1960.32" font-family="Geist" font-weight="600" font-size="30" fill="#FFFFFF">Instructions that sound like</text><text x="114" y="1996.32" font-family="Geist" font-weight="600" font-size="30" fill="#FFFFFF">you</text><text x="114" y="2043.82" font-family="Geist" font-weight="400" font-size="21" fill="#A0A0AA">Your role, clients, tone and languages, saved</text><text x="114" y="2073.22" font-family="Geist" font-weight="400" font-size="21" fill="#A0A0AA">once.</text><rect x="600" y="1822.32" width="520" height="300" fill="none" stroke="#333338" stroke-width="1"/><text x="634" y="1906.32" font-family="Archivo Expanded" font-weight="900" font-size="56" fill="#2340FF">02</text><text x="634" y="1960.32" font-family="Geist" font-weight="600" font-size="30" fill="#FFFFFF">Your tools, connected</text><text x="634" y="2007.82" font-family="Geist" font-weight="400" font-size="21" fill="#A0A0AA">Email, calendar and files, with only the access</text><text x="634" y="2037.22" font-family="Geist" font-weight="400" font-size="21" fill="#A0A0AA">you approve.</text><rect x="80" y="2122.32" width="520" height="300" fill="none" stroke="#333338" stroke-width="1"/><text x="114" y="2206.32" font-family="Archivo Expanded" font-weight="900" font-size="56" fill="#2340FF">03</text><text x="114" y="2260.32" font-family="Geist" font-weight="600" font-size="30" fill="#FFFFFF">Skills for your repeat work</text><text x="114" y="2307.82" font-family="Geist" font-weight="400" font-size="21" fill="#A0A0AA">One short sentence, and the work comes</text><text x="114" y="2337.22" font-family="Geist" font-weight="400" font-size="21" fill="#A0A0AA">back done your way.</text><rect x="600" y="2122.32" width="520" height="300" fill="none" stroke="#333338" stroke-width="1"/><text x="634" y="2206.32" font-family="Archivo Expanded" font-weight="900" font-size="56" fill="#2340FF">04</text><text x="634" y="2260.32" font-family="Geist" font-weight="600" font-size="30" fill="#FFFFFF">A cheat sheet and a tune up</text><text x="634" y="2307.82" font-family="Geist" font-weight="400" font-size="21" fill="#A0A0AA">Your best prompts on one page. We fix what&#x27;s</text><text x="634" y="2337.22" font-family="Geist" font-weight="400" font-size="21" fill="#A0A0AA">off two weeks later.</text><text x="80" y="2672.8" font-family="Archivo Expanded" font-weight="900" font-size="84" fill="#0B0B0C" letter-spacing="-2.52">HOW IT WORKS</text><text x="80" y="2718.56" font-family="Geist" font-weight="400" font-size="26" fill="#5E5E66">A short chat, one guided session and a check in two weeks later.</text><line x1="80" y1="2764.56" x2="1120" y2="2764.56" stroke="#E4E4E8" stroke-width="1"/><text x="80" y="2860.56" font-family="Archivo Expanded" font-weight="900" font-size="72" fill="#2340FF">01</text><text x="280" y="2816.56" font-family="Geist Mono" font-weight="400" font-size="18" fill="#5E5E66" letter-spacing="0.72">10 MINUTES, WHENEVER SUITS YOU</text><text x="280" y="2860.56" font-family="Geist" font-weight="600" font-size="34" fill="#0B0B0C">Chat with Charles, our AI agent</text><text x="280" y="2904.56" font-family="Geist" font-weight="400" font-size="23" fill="#5E5E66">He asks about your work, your tools and the tasks that eat your week.</text><line x1="80" y1="2954.56" x2="1120" y2="2954.56" stroke="#E4E4E8" stroke-width="1"/><text x="80" y="3050.56" font-family="Archivo Expanded" font-weight="900" font-size="72" fill="#2340FF">02</text><text x="280" y="3006.56" font-family="Geist Mono" font-weight="400" font-size="18" fill="#5E5E66" letter-spacing="0.72">VIDEO CALL, AS LONG AS IT TAKES</text><text x="280" y="3050.56" font-family="Geist" font-weight="600" font-size="34" fill="#0B0B0C">We set it up together</text><text x="280" y="3094.56" font-family="Geist" font-weight="400" font-size="23" fill="#5E5E66">You log in and share your screen. Your setup is prepared from the interview.</text><line x1="80" y1="3144.56" x2="1120" y2="3144.56" stroke="#E4E4E8" stroke-width="1"/><text x="80" y="3240.56" font-family="Archivo Expanded" font-weight="900" font-size="72" fill="#2340FF">03</text><text x="280" y="3196.56" font-family="Geist Mono" font-weight="400" font-size="18" fill="#5E5E66" letter-spacing="0.72">TWO WEEKS LATER</text><text x="280" y="3240.56" font-family="Geist" font-weight="600" font-size="34" fill="#0B0B0C">Use it, then we tune it</text><text x="280" y="3284.56" font-family="Geist" font-weight="400" font-size="23" fill="#5E5E66">We adjust what didn&#x27;t fit and add what you found you need.</text><line x1="80" y1="3334.56" x2="1120" y2="3334.56" stroke="#E4E4E8" stroke-width="1"/><text x="80" y="3505.04" font-family="Archivo Expanded" font-weight="900" font-size="84" fill="#0B0B0C" letter-spacing="-2.52">PACKAGES</text><text x="80" y="3550.8" font-family="Geist" font-weight="400" font-size="26" fill="#5E5E66">One time price, paid after the session. Care is optional.</text><rect x="80" y="3596.8" width="260" height="300" fill="#FFFFFF" stroke="#0B0B0C" stroke-width="2"/><text x="106" y="3648.8" font-family="Geist" font-weight="600" font-size="28" fill="#0B0B0C">Starter</text><text x="106" y="3766.8" font-family="Archivo Expanded" font-weight="900" font-size="60" fill="#0B0B0C" letter-spacing="-1.2">$100</text><text x="106" y="3818.8" font-family="Geist" font-weight="400" font-size="20" fill="#5E5E66">One AI tool, set up</text><text x="106" y="3845.8" font-family="Geist" font-weight="400" font-size="20" fill="#5E5E66">right.</text><rect x="340" y="3596.8" width="260" height="300" fill="#2340FF" stroke="#2340FF" stroke-width="2"/><text x="366" y="3648.8" font-family="Geist" font-weight="600" font-size="28" fill="#FFFFFF">Pro</text><text x="366" y="3680.8" font-family="Geist Mono" font-weight="400" font-size="15" fill="#D5DBFF" letter-spacing="0.9">RECOMMENDED</text><text x="366" y="3766.8" font-family="Archivo Expanded" font-weight="900" font-size="60" fill="#FFFFFF" letter-spacing="-1.2">$200</text><text x="366" y="3818.8" font-family="Geist" font-weight="400" font-size="20" fill="#D5DBFF">Built around your top</text><text x="366" y="3845.8" font-family="Geist" font-weight="400" font-size="20" fill="#D5DBFF">tasks.</text><rect x="600" y="3596.8" width="260" height="300" fill="#FFFFFF" stroke="#0B0B0C" stroke-width="2"/><text x="626" y="3648.8" font-family="Geist" font-weight="600" font-size="28" fill="#0B0B0C">Team</text><text x="626" y="3766.8" font-family="Archivo Expanded" font-weight="900" font-size="60" fill="#0B0B0C" letter-spacing="-1.2">$500</text><text x="626" y="3818.8" font-family="Geist" font-weight="400" font-size="20" fill="#5E5E66">For small businesses,</text><text x="626" y="3845.8" font-family="Geist" font-weight="400" font-size="20" fill="#5E5E66">up to 5 people.</text><rect x="860" y="3596.8" width="260" height="300" fill="#FFFFFF" stroke="#0B0B0C" stroke-width="2"/><text x="886" y="3648.8" font-family="Geist" font-weight="600" font-size="28" fill="#0B0B0C">Care</text><text x="886" y="3680.8" font-family="Geist Mono" font-weight="400" font-size="15" fill="#5E5E66" letter-spacing="0.9">OPTIONAL</text><text x="886" y="3766.8" font-family="Archivo Expanded" font-weight="900" font-size="60" fill="#0B0B0C" letter-spacing="-1.2">$25</text><text x="886" y="3818.8" font-family="Geist" font-weight="400" font-size="20" fill="#5E5E66">Keeps your setup</text><text x="886" y="3845.8" font-family="Geist" font-weight="400" font-size="20" fill="#5E5E66">current, per month.</text><rect x="80" y="3966.8" width="36" height="36" fill="#2340FF"/><path d="M88.4375 3985.36 L94.625 3991.55 L107.562 3977.49" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="square"/><text x="134" y="3993.8" font-family="Geist" font-weight="600" font-size="24" fill="#0B0B0C">No passwords, ever</text><rect x="426.667" y="3966.8" width="36" height="36" fill="#2340FF"/><path d="M435.104 3985.36 L441.292 3991.55 L454.229 3977.49" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="square"/><text x="480.667" y="3993.8" font-family="Geist" font-weight="600" font-size="24" fill="#0B0B0C">Only the access you</text><text x="480.667" y="4023.8" font-family="Geist" font-weight="600" font-size="24" fill="#0B0B0C">approve</text><rect x="773.333" y="3966.8" width="36" height="36" fill="#2340FF"/><path d="M781.771 3985.36 L787.958 3991.55 L800.896 3977.49" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="square"/><text x="827.333" y="3993.8" font-family="Geist" font-weight="600" font-size="24" fill="#0B0B0C">Pay after the session</text><rect x
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Geist+Mono:wght@400&display=swap">
<style>
body{margin:0;width:1800px;background:#F6F4FF;font-family:"Geist Mono",monospace;color:#14123A}
.row{display:grid;grid-template-columns:240px 1fr 1fr 300px;height:420px;border-bottom:1px solid #E9E4FF}
.info{padding:40px 28px;display:grid;align-content:start;gap:14px}
.n{font-size:15px;color:#5B3DF5;letter-spacing:.06em}
.t{font-family:Archivo;font-weight:800;font-size:34px;line-height:1;letter-spacing:-.02em}
.d{font-size:14px;line-height:1.5;color:#3A3766}
.cell{display:grid;place-items:center}
.dark{background:#14123A}
.ic{display:flex;align-items:center;justify-content:center;gap:26px}
.ic img{display:block}
</style></head><body>
<div class="row"><div class="info"><span class="n">04</span><span class="t">Ball + name</span><span class="d">The seam ball as a symbol, then TENNIX in full. Nothing to decode.</span></div><div class="cell"><img src="../png/4-ball-name-light.png" height="120"></div><div class="cell dark"><img src="../png/4-ball-name-dark.png" height="120"></div><div class="cell ic"><img src="../png/4-ball-name-icon.png" width="150"><img src="../png/4-ball-name-icon.png" width="40"></div></div>
<div class="row"><div class="info"><span class="n">05</span><span class="t">Sweet spot</span><span class="d">TENNIX in full. The X stays a letter, with the ball where its strokes cross.</span></div><div class="cell"><img src="../png/5-sweet-spot-light.png" height="120"></div><div class="cell dark"><img src="../png/5-sweet-spot-dark.png" height="120"></div><div class="cell ic"><img src="../png/5-sweet-spot-icon.png" width="150"><img src="../png/5-sweet-spot-icon.png" width="40"></div></div>
<div class="row"><div class="info"><span class="n">06</span><span class="t">Ball badge</span><span class="d">The name sits on the ball, between its seams. Name and symbol in one round mark.</span></div><div class="cell"><img src="../png/6-badge-light.png" height="230"></div><div class="cell dark"><img src="../png/6-badge-dark.png" height="230"></div><div class="cell ic"><img src="../png/6-badge-icon.png" width="150"><img src="../png/6-badge-icon.png" width="40"></div></div>
</body></html>
